<!DOCTYPE html><html lang="en">
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="theme-color" content="#111111">
        <meta name="description" content="My personal calculator app">
        <link rel="manifest" href="manifest.json">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Calculator</title><style>
    * {
        box-sizing: border-box;
        }

        body {
            background: #111827;
                font-family: Arial, sans-serif;
                    display: flex;
                        justify-content: center;
                            align-items: center;
                                min-height: 100vh;
                                    margin: 0;
                                    }

                                    .calculator {
                                        background: #1f2937;
                                            padding: 20px;
                                                border-radius: 20px;
                                                    width: 320px;
                                                        max-width: 95%;
                                                        }

                                                        h2 {
                                                            color: white;
                                                                text-align: center;
                                                                }

                                                                #display {
                                                                    width: 100%;
                                                                        height: 70px;
                                                                            background: #374151;
                                                                                color: white;
                                                                                    font-size: 30px;
                                                                                        text-align: right;
                                                                                            padding: 10px;
                                                                                                margin-bottom: 15px;
                                                                                                    border: none;
                                                                                                        border-radius: 10px;
                                                                                                        }

                                                                                                        .buttons {
                                                                                                            display: grid;
                                                                                                                grid-template-columns: repeat(4, 1fr);
                                                                                                                    gap: 8px;
                                                                                                                    }

                                                                                                                    button {
                                                                                                                        height: 55px;
                                                                                                                            border: none;
                                                                                                                                border-radius: 10px;
                                                                                                                                    background: #4b5563;
                                                                                                                                        color: white;
                                                                                                                                            font-size: 21px;
                                                                                                                                                cursor: pointer;
                                                                                                                                                    touch-action: manipulation;
                                                                                                                                                    }

                                                                                                                                                    .operator {
                                                                                                                                                        background: #f59e0b;
                                                                                                                                                            color: black;
                                                                                                                                                            }

                                                                                                                                                            .clear {
                                                                                                                                                                background: #ef4444;
                                                                                                                                                                }

                                                                                                                                                                .equal {
                                                                                                                                                                    background: #10b981;
                                                                                                                                                                        grid-column: span 2;
                                                                                                                                                                        }

                                                                                                                                                                        .zero {
                                                                                                                                                                            grid-column: span 2;
                                                                                                                                                                            }
                                                                                                                                                                            </style></head><body><div class="calculator">
                                                                                                                                                                                <h2>My Calculator</h2><input id="display" value="0" readonly>

                                                                                                                                                                                <div class="buttons">
                                                                                                                                                                                    <button class="clear" data-action="clear">AC</button>
                                                                                                                                                                                        <button data-action="delete">DEL</button>
                                                                                                                                                                                            <button class="operator" data-value="%">%</button>
                                                                                                                                                                                                <button class="operator" data-value="/">÷</button>

                                                                                                                                                                                                    <button data-value="7">7</button>
                                                                                                                                                                                                        <button data-value="8">8</button>
                                                                                                                                                                                                            <button data-value="9">9</button>
                                                                                                                                                                                                                <button class="operator" data-value="*">×</button>

                                                                                                                                                                                                                    <button data-value="4">4</button>
                                                                                                                                                                                                                        <button data-value="5">5</button>
                                                                                                                                                                                                                            <button data-value="6">6</button>
                                                                                                                                                                                                                                <button class="operator" data-value="-">−</button>

                                                                                                                                                                                                                                    <button data-value="1">1</button>
                                                                                                                                                                                                                                        <button data-value="2">2</button>
                                                                                                                                                                                                                                            <button data-value="3">3</button>
                                                                                                                                                                                                                                                <button class="operator" data-value="+">+</button>

                                                                                                                                                                                                                                                    <button data-value="0" class="zero">0</button>
                                                                                                                                                                                                                                                        <button data-value=".">.</button>
                                                                                                                                                                                                                                                            <button class="equal" data-action="calculate">=</button>
                                                                                                                                                                                                                                                            </div>

                                                                                                                                                                                                                                                            </div><script>
                                                                                                                                                                                                                                                            const display = document.getElementById("display");
                                                                                                                                                                                                                                                            const buttons = document.querySelector(".buttons");

                                                                                                                                                                                                                                                            let expression = "";
                                                                                                                                                                                                                                                            let finished = false;

                                                                                                                                                                                                                                                            function show(value) {
                                                                                                                                                                                                                                                                display.value = value || "0";
                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                function calculate() {
                                                                                                                                                                                                                                                                    if (!expression) return;

                                                                                                                                                                                                                                                                        try {
                                                                                                                                                                                                                                                                                if (!/^[0-9+\-*/%.() ]+$/.test(expression)) {
                                                                                                                                                                                                                                                                                            throw new Error("Invalid");
                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                            const exp = expression.replace(
                                                                                                                                                                                                                                                                                                                        /(\d+(?:\.\d+)?)%/g,
                                                                                                                                                                                                                                                                                                                                    "($1/100)"
                                                                                                                                                                                                                                                                                                                                            );

                                                                                                                                                                                                                                                                                                                                                    const result = Function(
                                                                                                                                                                                                                                                                                                                                                                '"use strict"; return (' + exp + ')'
                                                                                                                                                                                                                                                                                                                                                                        )();

                                                                                                                                                                                                                                                                                                                                                                                if (!Number.isFinite(result)) {
                                                                                                                                                                                                                                                                                                                                                                                            throw new Error("Invalid");
                                                                                                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                                                                                                            expression = String(Number(result.toPrecision(12)));
                                                                                                                                                                                                                                                                                                                                                                                                                    show(expression);
                                                                                                                                                                                                                                                                                                                                                                                                                            finished = true;

                                                                                                                                                                                                                                                                                                                                                                                                                                } catch (error) {
                                                                                                                                                                                                                                                                                                                                                                                                                                        show("Error");
                                                                                                                                                                                                                                                                                                                                                                                                                                                expression = "";
                                                                                                                                                                                                                                                                                                                                                                                                                                                        finished = true;
                                                                                                                                                                                                                                                                                                                                                                                                                                                            }
                                                                                                                                                                                                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                                                                                                                                                                                            buttons.addEventListener("click", function(event) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                const button = event.target.closest("button");

                                                                                                                                                                                                                                                                                                                                                                                                                                                                    if (!button) return;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                        const action = button.dataset.action;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const value = button.dataset.value;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                if (action === "clear") {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        expression = "";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                finished = false;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        show("0");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        if (action === "delete") {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                if (finished) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            expression = "";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        finished = false;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                } else {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            expression = expression.slice(0, -1);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            show(expression);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            if (action === "calculate") {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    calculate();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    if (value !== undefined) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            if (finished || display.value === "Error") {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        expression = "";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    finished = false;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    expression += value;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            show(expression);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                } 
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    if ("serviceWorker" in navigator) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      window.addEventListener("load", () => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          navigator.serviceWorker.register("./service-worker.js")
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                .then(() => console.log("Calculator ready offline!"))
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      .catch(error => console.log("Service worker error:", error));
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </html>
